name: GitHub Pages (Production + Previews)

# Stateless deploy: every run rebuilds the entire site from the branches that
# exist right now — production from main at the root, and one preview per other
# branch under previews/. Nothing is accumulated between runs, so there is no
# deploy branch to keep in sync and stale previews are structurally impossible:
# a deleted branch simply is not rebuilt.
#
# Pages source must be set to "GitHub Actions" (Settings -> Pages), not a branch.

on:
  push:
    branches-ignore:
      - pages-src        # historical deploy branch; ignored if it still exists
  delete:
    branches:
      - "**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Quality gate
    runs-on: ubuntu-latest
    # Only a push carries code worth testing; deletes and cron just rebuild.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [test]
    # `needs` alone would skip this whenever the gate is skipped, so accept a
    # skipped gate (delete / schedule / manual) but never a failed one.
    if: always() && needs.test.result != 'failure' && needs.test.result != 'cancelled'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Assemble the site
        run: |
          set -euo pipefail
          SUBROOT="${{ vars.PREVIEW_SUBPATH }}"
          [ -z "$SUBROOT" ] && SUBROOT="previews"
          echo "SUBROOT=$SUBROOT" >> "$GITHUB_ENV"

          # Production root: main, minus anything that is build-time only.
          mkdir -p site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.gitignore' \
            --exclude 'node_modules' --exclude '/tests' \
            main/ site/

          # Jekyll would otherwise drop files beginning with an underscore.
          touch site/.nojekyll

          # One preview per branch that exists right now. Because the set is
          # read fresh each run, a deleted branch disappears on the next deploy
          # with no pruning step and no reconciliation.
          mkdir -p "site/$SUBROOT"
          BRANCHES=$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}.git" \
            | awk '{print $2}' | sed 's#refs/heads/##' \
            | grep -vx 'main' | grep -vx 'pages-src' || true)

          for BRANCH in $BRANCHES; do
            SAFE=$(echo "$BRANCH" | sed 's#[^A-Za-z0-9._-]#-#g')
            echo "::group::preview $BRANCH -> $SUBROOT/$SAFE"
            rm -rf _branch
            # A shallow single-branch clone keeps this cheap as branches grow.
            if git clone --depth 1 --branch "$BRANCH" --single-branch \
                 "https://github.com/${GITHUB_REPOSITORY}.git" _branch 2>/dev/null; then
              mkdir -p "site/$SUBROOT/$SAFE"
              rsync -a \
                --exclude '.git' --exclude '.github' --exclude '.gitignore' \
                --exclude 'node_modules' --exclude '/tests' \
                _branch/ "site/$SUBROOT/$SAFE/"
            else
              echo "could not clone $BRANCH; skipping its preview"
            fi
            rm -rf _branch
            echo "::endgroup::"
          done

      - name: Generate previews index
        run: |
          set -euo pipefail
          INDEX="site/${SUBROOT}/index.html"
          {
            echo '<!doctype html>'
            echo '<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<title>Branch Previews</title>'
            echo '<style>body{font:16px/1.5 system-ui,Segoe UI,Roboto,Arial;margin:24px;color:#111}'
            echo 'a{color:#2563eb;text-decoration:none}a:hover{text-decoration:underline}'
            echo 'ul{padding-left:20px}.note{color:#555;margin-top:12px}</style>'
            echo '<h1>Branch Previews</h1>'
            shopt -s nullglob
            DIRS=(site/${SUBROOT}/*/)
            if [ ${#DIRS[@]} -eq 0 ]; then
              echo '<p>No branches other than <code>main</code> right now.</p>'
            else
              echo '<ul>'
              for d in "${DIRS[@]}"; do
                name=$(basename "$d")
                echo "<li><a href=\"./$name/\">$name</a></li>"
              done
              echo '</ul>'
            fi
            echo '<p class="note">Production uses <code>main</code> at the site root.</p>'
          } > "$INDEX"

      - name: Report what was built
        run: |
          set -euo pipefail
          {
            echo "## 🚀 Deployed"
            echo "- Production: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo "- Previews: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${SUBROOT}/"
            echo ""
            echo "| Path | Files |"
            echo "|---|---|"
            echo "| / (main) | $(find site -maxdepth 1 -type f | wc -l) at root |"
            for d in site/${SUBROOT}/*/; do
              [ -d "$d" ] || continue
              echo "| ${SUBROOT}/$(basename "$d")/ | $(find "$d" -type f | wc -l) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
