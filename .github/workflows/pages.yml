name: GitHub Pages (Production + Previews)

on:
  push:
    branches-ignore:
      - pages-src
  delete:
    branches:
      - "**"
  schedule:
    - cron: "17 3 * * *"  # optional nightly reconciliation

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-src
  cancel-in-progress: false

jobs:
  pages:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Compute variables
        id: vars
        run: |
          EVENT="${GITHUB_EVENT_NAME}"
          REF_TYPE="${{ github.event.ref_type }}"
          if [ "$EVENT" = "delete" ] && [ "$REF_TYPE" = "branch" ]; then
            BRANCH="${{ github.event.ref }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi
          SAFE_BRANCH=$(echo "${BRANCH}" | sed 's#[^A-Za-z0-9._-]#-#g')
          SUBROOT="${{ vars.PREVIEW_SUBPATH }}"
          [ -z "${SUBROOT}" ] && SUBROOT="previews"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "safe_branch=${SAFE_BRANCH}" >> $GITHUB_OUTPUT
          echo "event=${EVENT}" >> $GITHUB_OUTPUT
          echo "ref_type=${REF_TYPE}" >> $GITHUB_OUTPUT
          echo "subroot=${SUBROOT}" >> $GITHUB_OUTPUT

      - name: Checkout source (push only)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required files (push)
        if: github.event_name == 'push'
        run: |
          test -f index.html && test -f manifest.json && test -f sw.js && test -f package.json

      - name: Validate JSON syntax (push)
        if: github.event_name == 'push'
        run: |
          python3 -m json.tool manifest.json > /dev/null
          python3 -m json.tool package.json > /dev/null

      - name: Quick app smoke test (push)
        if: github.event_name == 'push'
        run: |
          python3 -m http.server 8000 &
          sleep 2
          curl -f http://localhost:8000/ | grep -q "Calendar Planner"
          curl -f http://localhost:8000/manifest.json > /dev/null
          curl -f http://localhost:8000/sw.js > /dev/null

      - name: Checkout main (for production root on any push)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main

      - name: Check if pages-src branch exists
        id: pages_src_exists
        run: |
          if git ls-remote --exit-code --heads "${{ github.server_url }}/${{ github.repository }}.git" pages-src >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout pages-src (existing)
        if: steps.pages_src_exists.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: pages-src
          path: site
          persist-credentials: true

      - name: Initialize pages-src (first run)
        if: steps.pages_src_exists.outputs.exists == 'false'
        run: |
          set -e
          git init site
          pushd site
          git checkout -b pages-src
          echo "<!doctype html><meta charset=\"utf-8\"><title>Pages</title>" > index.html
          touch .nojekyll
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -m "chore: init pages-src"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -u origin pages-src
          popd

      - name: Update site content (push)
        if: github.event_name == 'push'
        run: |
          set -e
          BRANCH='${{ steps.vars.outputs.branch }}'
          SAFE='${{ steps.vars.outputs.safe_branch }}'
          SUBROOT='${{ steps.vars.outputs.subroot }}'
          ROOT="site"
          mkdir -p "$ROOT"
          # Sync production root from main while PROTECTING the previews subfolder from deletion
          rsync -a --delete --exclude ".git" --exclude ".github" \
            --filter="P ${SUBROOT}/" \
            repo-main/ "$ROOT/"
          if [ "$BRANCH" != "main" ]; then
            TARGET="site/$SUBROOT/$SAFE"
            rm -rf "$TARGET" && mkdir -p "$TARGET"
            rsync -a --exclude ".git" --exclude ".github" ./ "$TARGET/"
          fi

      - name: Prune on branch delete
        if: github.event_name == 'delete' && steps.vars.outputs.ref_type == 'branch'
        run: |
          set -e
          BRANCH='${{ steps.vars.outputs.branch }}'
          SAFE='${{ steps.vars.outputs.safe_branch }}'
          SUBROOT='${{ steps.vars.outputs.subroot }}'
          [ "$BRANCH" = "main" ] && exit 0
          TARGET="site/$SUBROOT/$SAFE"
          [ -d "$TARGET" ] && rm -rf "$TARGET" || true

      - name: Nightly reconciliation (optional)
        if: github.event_name == 'schedule'
        run: |
          set -e
          SUBROOT='${{ steps.vars.outputs.subroot }}'
          mkdir -p "site/$SUBROOT"
          mapfile -t BRANCHES < <(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##')
          ALLOW=""
          for B in "${BRANCHES[@]}"; do
            [ "$B" = "main" ] && continue
            SAFE=$(echo "$B" | sed 's#[^A-Za-z0-9._-]#-#g')
            ALLOW="$ALLOW $SAFE"
          done
          CHANGED=0
          shopt -s nullglob
          for D in site/"$SUBROOT"/*; do
            [ -d "$D" ] || continue
            NAME=$(basename "$D")
            if [[ " $ALLOW " != *" $NAME "* ]]; then
              rm -rf "$D"; CHANGED=1
            fi
          done
          echo "CHANGED=$CHANGED" >> $GITHUB_ENV

      - name: Generate previews index
        run: |
          set -e
          SUBROOT='${{ steps.vars.outputs.subroot }}'
          mkdir -p "site/$SUBROOT"
          INDEX="site/$SUBROOT/index.html"
          {
            echo "<!doctype html>"
            echo "<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">"
            echo "<title>Branch Previews</title>"
            echo "<style>body{font:16px/1.5 system-ui,Segoe UI,Roboto,Arial;margin:24px;color:#111}a{color:#2563eb;text-decoration:none}a:hover{text-decoration:underline} ul{padding-left:20px} .note{color:#555;margin-top:12px}</style>"
            echo "<h1>Branch Previews</h1><ul>"
            shopt -s nullglob
            for d in site/$SUBROOT/*; do [ -d "$d" ] || continue; name=$(basename "$d"); echo "<li><a href=\"./$name/\">$name</a></li>"; done
            echo "</ul><p class=\"note\">Production uses <code>main</code> at site root.</p>"
          } > "$INDEX"

      - name: Commit pages-src changes
        run: |
          set -e
          pushd site
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            MSG="deploy: ${{ steps.vars.outputs.event }} ${{ steps.vars.outputs.branch }}"
            git -c user.name="github-actions" -c user.email="actions@github.com" commit -m "$MSG"
            git push origin pages-src
          fi
          popd

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload aggregated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Summary with links
        run: |
          OWNER='${{ github.repository_owner }}'
          REPO='${{ github.repository }}'
          REPO_NAME="${REPO#*/}"
          BASE="https://${OWNER}.github.io/${REPO_NAME}"
          SUBROOT='${{ steps.vars.outputs.subroot }}'
          BRANCH='${{ steps.vars.outputs.branch }}'
          SAFE='${{ steps.vars.outputs.safe_branch }}'
          {
            echo "## 🚀 Pages Deployment"
            echo "- Production: ${BASE}/"
            echo "- Previews index: ${BASE}/${SUBROOT}/"
            if [ "${{ github.event_name }}" = "push" ] && [ "$BRANCH" != "main" ]; then
              echo "- Preview (${BRANCH}): ${BASE}/${SUBROOT}/${SAFE}/"
            fi
            echo "- Event: ${{ github.event_name }} | Branch: ${BRANCH}"
          } >> $GITHUB_STEP_SUMMARY
